rest:
  defaults:
    connection-pool:
      size: "\${DEFAULT_REST_CONNECTION_POOL_SIZE:10}"
      size-per-route: "\${DEFAULT_REST_CONNECTION_POOL_SIZE_PER_ROUTE:5}"
      time-to-live-minutes: "\${DEFAULT_REST_CONNECTION_POOL_TIME_TO_LIVE_MINUTES:10}"
    timeout:
      connect-millis: "\${DEFAULT_REST_TIMEOUT_CONNECT_MILLIS:120000}"
      read-millis: "\${DEFAULT_REST_TIMEOUT_READ_MILLIS:120000}"
  organization:
    base-url: "\${ORGANIZATION_BASE_URL:http://localhost:8081}"
    max-attempts: "\${ORGANIZATION_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${ORGANIZATION_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${ORGANIZATION_PRINT_BODY_WHEN_ERROR:true}"
  workflow-hub:
    base-url: "\${WORKFLOW_HUB_BASE_URL:http://localhost:8082}"
    max-attempts: "\${WORKFLOW_HUB_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${WORKFLOW_HUB_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${WORKFLOW_HUB_PRINT_BODY_WHEN_ERROR:true}"
  classification:
    base-url: "\${CLASSIFICATION_BASE_URL:http://localhost:8083}"
    max-attempts: "\${CLASSIFICATION_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${CLASSIFICATION_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${CLASSIFICATION_PRINT_BODY_WHEN_ERROR:true}"

iuv:
  information-system-id: "\${IUV_INFORMATION_SYSTEM_ID:00}"
nav:
  aux-digit: "\${NAV_AUX_DIGIT:3}"

category:
  prefix: "9/"
  suffix: "/"

data-export:
  default:
    max-total-elements: "\${DATA_EXPORT_MAX_TOTAL_ELEMENTS: 100000}"
    max-months-interval: "${DATA_EXPORT_MAX_MONTHS_INTERVAL: 6}"
  installment-paid-view:
    max-months-interval: "\${INSTALLMENT_PAID_VIEW_MAX_MONTHS_INTERVAL:\${data-export.default.max-months-interval}}"
    max-total-elements: "\${INSTALLMENT_PAID_VIEW_MAX_TOTAL_ELEMENTS:\${data-export.default.max-total-elements}}"
  receipt-archiving-view:
    max-months-interval: "\${RECEIPT_ARCHIVING_VIEW_MAX_MONTHS_INTERVAL: \${data-export.default.max-months-interval}}"
    max-total-elements: "\${RECEIPT_ARCHIVING_VIEW_MAX_TOTAL_ELEMENTS:\${data-export.default.max-total-elements}}"

cache:
  pii:
    size: "\${CACHE_PII_SIZE:1000}"
    expire-in: "\${CACHE_PII_MINUTES:60}"
  broker:
    size: "\${CACHE_BROKER_SIZE:100}"
    expire-in: "\${CACHE_BROKER_MINUTES:10}"
  organization:
    size: "\${CACHE_ORGANIZATION_SIZE:100}"
    expire-in: "\${CACHE_ORGANIZATION_MINUTES:60}"
  taxonomy:
    size: "\${CACHE_TAXONOMY_SIZE:100}"
    expire-in: "\${CACHE_TAXONOMY_MINUTES:60}"

features:
  organization:
    piva-check: "\${FEATURE_ORGANIZATION_PIVA_CHECK:true}"

wf-await:
  max-waiting-minutes: "\${WORKFLOW_AWAIT_MAX_WAITING_MINUTES:5}"
  retry-delays-ms: "\${WORKFLOW_AWAIT_RETRY_DELAYS_MS:1000}"

massive-update:
  expired-threshold-years: "\${EXPIRED_THRESHOLD_YEARS_FOR_MASSIVE_IBAN_UPDATE:1}"
