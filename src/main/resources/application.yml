server:
  http: "\${SERVER_PORT:8080}"

spring:
  application:
    name: ${artifactId}
    version: ${version}
  jmx.enabled: true
  threads:
    virtual:
      enabled: "\${VIRTUAL_THREADS_ENABLED:true}"
  jpa:
    show-sql: "\${SHOW_SQL:false}"
    hibernate:
      ddl-auto: none
  datasource:
    debt-position:
      jdbc-url: "\${DEBT_POSITIONS_DB_URL:jdbc:postgresql://\${DEBT_POSITIONS_DB_HOST:localhost}:\${DEBT_POSITIONS_DB_PORT:5432}/\${DEBT_POSITIONS_DB_NAME:payhub}?currentSchema=debt_positions}"
      username: "\${DEBT_POSITIONS_DB_USER}"
      password: "\${DEBT_POSITIONS_DB_PASSWORD}"
      driverClassName: org.postgresql.Driver
      idle-timeout: "\${DEBT_POSITIONS_DB_CONNECTION_IDLE_TIMEOUT_MILLISECONDS:600000}"
      connection-timeout: "\${DEBT_POSITIONS_DB_CONNECTION_TIMEOUT_MILLISECONDS:30000}"
      keepalive-time: "\${DEBT_POSITIONS_DB_CONNECTION_KEEPALIVE_TIME_MILLISECONDS:120000}"
      max-lifetime: "\${DEBT_POSITIONS_DB_CONNECTION_MAX_LIFETIME_MILLISECONDS:1800000}"
      maximum-pool-size: "\${DEBT_POSITIONS_DB_CONNECTION_MAX_POOL_SIZE:20}"
      minimum-idle: "\${DEBT_POSITIONS_DB_CONNECTION_MIN_IDLE:20}"
    citizen:
      jdbc-url: "\${CITIZENDB_URL:jdbc:postgresql://\${CITIZENDB_HOST:localhost}:\${CITIZENDB_PORT:5432}/citizen}"
      username: "\${CITIZENDB_USER}"
      password: "\${CITIZENDB_PASSWORD}"
      driverClassName: org.postgresql.Driver
      idle-timeout: "\${CITIZENDB_CONNECTION_IDLE_TIMEOUT_MILLISECONDS:600000}"
      connection-timeout: "\${CITIZENDB_CONNECTION_TIMEOUT_MILLISECONDS:30000}"
      keepalive-time: "\${CITIZENDB_CONNECTION_KEEPALIVE_TIME_MILLISECONDS:120000}"
      max-lifetime: "\${CITIZENDB_CONNECTION_MAX_LIFETIME_MILLISECONDS:1800000}"
      maximum-pool-size: "\${CITIZENDB_CONNECTION_MAX_POOL_SIZE:20}"
      minimum-idle: "\${CITIZENDB_CONNECTION_MIN_IDLE:20}"
  data:
    rest:
      basePath: crud
  cloud:
    function:
      definition: paymentsProducer
    stream:
      binders:
        kafka-payments-producer:
          type: kafka
          environment:
            spring.cloud.stream.kafka.binder:
              brokers: "\${KAFKA_BINDER_BROKER:}"
              configuration:
                sasl.jaas.config: "\${KAFKA_PAYMENTS_PRODUCER_SASL_JAAS_CONFIG:}"
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
      bindings:
        paymentsProducer-out-0:
          binder: kafka-payments-producer
          content-type: "\${KAFKA_CONTENT_TYPE:application/json}"
          destination: "\${KAFKA_TOPIC_PAYMENTS:p4pa-payhub-payments-evh}"
      kafka:
        binder:
          auto-create-topics: false
          configuration:
            heartbeat.interval.ms: "\${KAFKA_CONFIG_HEARTBEAT_INTERVAL_MS:3000}"
            session.timeout.ms: "\${KAFKA_CONFIG_SESSION_TIMEOUT_MS:30000}"
            request.timeout.ms: "\${KAFKA_CONFIG_REQUEST_TIMEOUT_MS:60000}"
            metadata.max.age.ms: "\${KAFKA_CONFIG_METADATA_MAX_AGE:180000}"
            sasl.mechanism: "\${KAFKA_CONFIG_SASL_MECHANISM:PLAIN}"
            security.protocol: "\${KAFKA_CONFIG_SECURITY_PROTOCOL:SASL_SSL}"
            max.request.size: "\${KAFKA_CONFIG_MAX_REQUEST_SIZE:1000000}"
        binders:
          paymentsProducer-out-0:
            producer:
              configuration:
                client.id: debt-positions
                connections.max.idle.ms: "\${KAFKA_PAYMENTS_PRODUCER_CONNECTION_MAX_IDLE_TIME:180000}"
                retry.backoff.ms: "\${KAFKA_PAYMENTS_PRODUCER_RETRY_MS:\${KAFKA_RETRY_MS:10000}}"
                linger.ms: "\${KAFKA_PAYMENTS_PRODUCER_LINGER_MS:\${KAFKA_LINGER_MS:2}}"
                batch.size: "\${KAFKA_PAYMENTS_PRODUCER_BATCH_SIZE:\${KAFKA_BATCH_SIZE:16384}}"

management:
  info:
    build.enabled: true
    java.enabled: true
    git.enabled: true
  otlp.metrics.export.enabled: "\${TRACING_EXPORT:false}"
  tracing:
    sampling.probability: "\${TRACING_SAMPLING_PROBABILITY:1.0}"
    baggage.remote-fields:
      - X-user-id
  observations:
    http.server:
        filter.order: -100
  endpoints:
    jmx:
      exposure.include: "*"
    web:
      exposure:
        include: health, info, prometheus, metrics, caches
      base-path: /actuator
  endpoint:
    health:
      probes.enabled: true
      logging.slow-indicator-threshold: "\${HEALTH_ACTUATOR_LOGGER_TIMEOUT_DURATION:PT1S}"
      show-details: "\${HEALTH_ACTUATOR_SHOW_DETAILS:when-authorized}"
      group:
        readiness.include: "*"
        liveness.include: livenessState,diskSpace,ping,binders
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${artifactId}
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true
    enable:
      jvm: true
      process: true
      system: true
      http: true
      logback: true

springwolf:
  docket:
    base-package: it.gov.pagopa.pu.debtpositions.event
    info:
      title: "\${spring.application.name}"
      version: "\${spring.application.version}"
      description: AsyncAPI And Models
    servers.kafka-server:
      protocol: kafka
      host: "\${KAFKA_BINDER_BROKER:localhost:9093}"
  use-fqn: false

logging:
  level:
    root: "\${LOG_LEVEL_ROOT:INFO}"
    it.gov.pagopa: "\${LOG_LEVEL_PAGOPA:INFO}"
    org.springframework: "\${LOG_LEVEL_SPRING:INFO}"
    org.springframework.boot.availability: "\${LOG_LEVEL_SPRING_BOOT_AVAILABILITY:DEBUG}"
    org.springframework.kafka: "\${LOG_LEVEL_SPRING_KAFKA:INFO}"
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: "\${LOG_LEVEL_KAFKA_CONSUMER_COORDINATOR:WARN}"
    org.apache.kafka.clients.admin.internals.AdminMetadataManager: "\${LOG_LEVEL_KAFKA_ADMIN_METADATA_MANAGER:WARN}"
    it.gov.pagopa.pu.debtpositions.exception.DebtPositionExceptionHandler: "\${LOGGING_LEVEL_API_REQUEST_EXCEPTION:INFO}"
    org.springdoc.core.utils.SpringDocAnnotationsUtils: "\${LOG_LEVEL_SPRING_DOC:ERROR}"
    PERFORMANCE_LOG: "\${LOG_LEVEL_PERFORMANCE_LOG:INFO}"
    PERFORMANCE_LOG.API_REQUEST: "\${LOG_LEVEL_PERFORMANCE_LOG_API_REQUEST:\${logging.level.PERFORMANCE_LOG}}"
    PERFORMANCE_LOG.REST_INVOKE: "\${LOG_LEVEL_PERFORMANCE_LOG_REST_INVOKE:\${logging.level.PERFORMANCE_LOG}}"

data-cipher:
  encrypt-psw: "\${DATA_CIPHER_ENCRYPT_PASSWORD:PWD}"
  hash-pepper: "\${DATA_CIPHER_HASH_PEPPER:PEPPER}"

springdoc:
  api-docs.version: openapi_3_0
  writer-with-default-pretty-printer: true

